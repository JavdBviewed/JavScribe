# JavScribe Client — CI/CD release（三期）
# 触发：
#   - tag `client-v*`：完整 release（打包 + e2e 冒烟 + 建 GitHub Release）
#   - 手动 dispatch：调试构建（产物留 Actions artifacts，不建 Release）
# 平台：windows-latest（NSIS+portable+zip）/ ubuntu-latest（AppImage+deb+zip）；无 macOS。
# 约定：tag 版本号必须等于根 package.json 的 version（构建前校验，防打错包）。
name: release-client

on:
  push:
    tags: ["client-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "调试构建版本号（留空 = package.json 当前版本）"
        required: false

permissions:
  contents: write

concurrency:
  group: release-client-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 校验 tag 版本 = package.json 版本
        if: startsWith(github.ref, 'refs/tags/client-v')
        shell: bash
        run: |
          want="${GITHUB_REF#refs/tags/client-v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "::error::tag 版本 $want 与 package.json 版本 $have 不一致"
            exit 1
          fi
      - name: 应用调试版本号（手动触发）
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        shell: bash
        run: pnpm version "${{ inputs.version }}" --no-git-tag-version --no-git-commit-version
      - run: pnpm install --frozen-lockfile
      - name: 解析 BtbN latest 标签（ffmpeg 缓存键）
        id: ff
        shell: bash
        run: |
          loc="$(curl -sIL "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip" \
            | grep -i '^location:' | tail -1 | sed 's/^[Ll]ocation:[[:space:]]*//' | tr -d '\r')"
          tag="$(printf '%s' "$loc" | sed 's|.*releases/download/||; s|/.*||')"
          echo "tag=${tag:-unknown}" >> "$GITHUB_OUTPUT"
      - name: ffmpeg 静态构建缓存
        uses: actions/cache@v4
        with:
          path: client/packaging/ffmpeg
          key: javscribe-ffmpeg-win-${{ steps.ff.outputs.tag }}
      - run: node scripts/fetch-ffmpeg.mjs win
      - run: pnpm typecheck
      - run: pnpm build:desktop
      - name: e2e 冒烟（桌面子集：functional + ui-structure，mock serve）
        shell: bash
        env:
          JAVSCRIBE_FFMPEG: client/packaging/ffmpeg/ffmpeg.exe
        run: |
          pnpm exec playwright test --config playwright.desktop.config.ts \
            client/tests/e2e/desktop/functional.spec.ts \
            client/tests/e2e/desktop/ui-structure.spec.ts
      - name: 打包（NSIS + portable + zip）
        run: pnpm exec electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release
          retention-days: 14

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 校验 tag 版本 = package.json 版本
        if: startsWith(github.ref, 'refs/tags/client-v')
        run: |
          want="${GITHUB_REF#refs/tags/client-v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "::error::tag 版本 $want 与 package.json 版本 $have 不一致"
            exit 1
          fi
      - name: 应用调试版本号（手动触发）
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: pnpm version "${{ inputs.version }}" --no-git-tag-version --no-git-commit-version
      - run: pnpm install --frozen-lockfile
      - name: 解析 BtbN latest 标签（ffmpeg 缓存键）
        id: ff
        run: |
          loc="$(curl -sIL "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz" \
            | grep -i '^location:' | tail -1 | sed 's/^[Ll]ocation:[[:space:]]*//' | tr -d '\r')"
          tag="$(printf '%s' "$loc" | sed 's|.*releases/download/||; s|/.*||')"
          echo "tag=${tag:-unknown}" >> "$GITHUB_OUTPUT"
      - name: ffmpeg 静态构建缓存
        uses: actions/cache@v4
        with:
          path: client/packaging/ffmpeg
          key: javscribe-ffmpeg-linux-${{ steps.ff.outputs.tag }}
      - run: node scripts/fetch-ffmpeg.mjs linux
      - run: pnpm typecheck
      - run: pnpm build:desktop
      - name: e2e 冒烟（桌面子集：functional + ui-structure，mock serve，xvfb）
        env:
          JAVSCRIBE_FFMPEG: client/packaging/ffmpeg/ffmpeg
        run: |
          xvfb-run -a pnpm exec playwright test --config playwright.desktop.config.ts \
            client/tests/e2e/desktop/functional.spec.ts \
            client/tests/e2e/desktop/ui-structure.spec.ts
      - name: 打包（AppImage + deb + zip）
        run: pnpm exec electron-builder --linux --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release
          retention-days: 14

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/client-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-all
      - name: 建 GitHub Release（tag 同名）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-all/release-windows/**
            dist-all/release-linux/**
          body: |
            JavScribe Client（${{ github.ref_name }}）—— 未签名构建（签名/公证为后续议题）。

            **Windows**：NSIS 安装包 / portable 单文件 / zip
            **Linux**：AppImage / deb / zip

            - 随包静态 ffmpeg：首次启动即可本地提音轨，无需系统安装
              （可用环境变量 `JAVSCRIBE_FFMPEG` 覆盖）
            - 多字幕服务登记、API Key 本地存储、srt 写回原目录均为原生能力
