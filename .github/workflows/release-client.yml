# JavScribe Client — CI/CD release（三期）
# 触发：
#   - tag `client-v*`：完整 release（打包 + e2e 冒烟 + 建 GitHub Release）
#   - 手动 dispatch：调试构建（产物留 Actions artifacts，不建 Release）
# 平台：windows-latest（NSIS+portable+zip）/ ubuntu-latest（AppImage+deb+zip）；无 macOS。
# 约定：tag 版本号必须等于根 package.json 的 version（构建前校验，防打错包）。
name: release-client

on:
  push:
    tags: ["client-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "调试构建版本号（留空 = package.json 当前版本）"
        required: false

permissions:
  contents: write

concurrency:
  group: release-client-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 校验 tag 版本 = package.json 版本
        if: startsWith(github.ref, 'refs/tags/client-v')
        shell: bash
        run: |
          want="${GITHUB_REF#refs/tags/client-v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "::error::tag 版本 $want 与 package.json 版本 $have 不一致"
            exit 1
          fi
      - name: 应用调试版本号（手动触发）
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        shell: bash
        run: pnpm version "${{ inputs.version }}" --no-git-tag-version --no-git-commit-version
      - run: pnpm install --frozen-lockfile
      - name: 解析 BtbN latest（ffmpeg 缓存键 = API 响应哈希）
        id: ff
        shell: bash
        run: |
          # BtbN 发布频繁且命名多变（autobuild 标签 / latest 标签互换、资产改名）：
          # 用 latest release API 响应的 sha256 前 16 位作缓存键，上游一变自动失效
          json="$(curl -sf --retry 3 --retry-delay 2 -H 'user-agent: javscribe-ci' \
            https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest)" || json="{}"
          key="$(printf '%s' "$json" | sha256sum | cut -c1-16)"
          echo "key=${key:-unknown}" >> "$GITHUB_OUTPUT"
      - name: ffmpeg 静态构建缓存
        uses: actions/cache@v4
        with:
          path: client/packaging/ffmpeg
          key: javscribe-ffmpeg-win-${{ steps.ff.outputs.key }}
      - run: node scripts/fetch-ffmpeg.mjs win
      - run: pnpm typecheck
      - run: pnpm build:desktop
      - name: e2e 冒烟（桌面子集：functional + ui-structure，mock serve）
        shell: bash
        env:
          JAVSCRIBE_FFMPEG: client/packaging/ffmpeg/ffmpeg.exe
        # --reporter=list,github：失败断言以 annotation 写入 job（API/UI 可见，免翻全量日志）
        run: |
          pnpm exec playwright test --config playwright.desktop.config.ts \
            --reporter=list,github \
            client/tests/e2e/desktop/functional.spec.ts \
            client/tests/e2e/desktop/ui-structure.spec.ts
      - name: 打包（NSIS + portable + zip）
        run: pnpm exec electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release
          retention-days: 14

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 校验 tag 版本 = package.json 版本
        if: startsWith(github.ref, 'refs/tags/client-v')
        run: |
          want="${GITHUB_REF#refs/tags/client-v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "::error::tag 版本 $want 与 package.json 版本 $have 不一致"
            exit 1
          fi
      - name: 应用调试版本号（手动触发）
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: pnpm version "${{ inputs.version }}" --no-git-tag-version --no-git-commit-version
      - run: pnpm install --frozen-lockfile
      - name: 解析 BtbN latest（ffmpeg 缓存键 = API 响应哈希）
        id: ff
        shell: bash
        run: |
          # BtbN 发布频繁且命名多变（autobuild 标签 / latest 标签互换、资产改名）：
          # 用 latest release API 响应的 sha256 前 16 位作缓存键，上游一变自动失效
          json="$(curl -sf --retry 3 --retry-delay 2 -H 'user-agent: javscribe-ci' \
            https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest)" || json="{}"
          key="$(printf '%s' "$json" | sha256sum | cut -c1-16)"
          echo "key=${key:-unknown}" >> "$GITHUB_OUTPUT"
      - name: ffmpeg 静态构建缓存
        uses: actions/cache@v4
        with:
          path: client/packaging/ffmpeg
          key: javscribe-ffmpeg-linux-${{ steps.ff.outputs.key }}
      - run: node scripts/fetch-ffmpeg.mjs linux
      - run: pnpm typecheck
      - run: pnpm build:desktop
      - name: e2e 系统依赖（Electron 运行库）
        # sudo 会重置 PATH 到 secure_path，pnpm 在 toolcache 里会丢；用 env 在 sudo 内重建 PATH
        run: sudo env "PATH=$PATH" pnpm exec playwright install-deps
      - name: e2e 冒烟（桌面子集：functional + ui-structure，mock serve，xvfb）
        env:
          JAVSCRIBE_FFMPEG: client/packaging/ffmpeg/ffmpeg
        # --reporter=list,github：失败断言以 annotation 写入 job（API/UI 可见，免翻全量日志）
        run: |
          xvfb-run -a pnpm exec playwright test --config playwright.desktop.config.ts \
            --reporter=list,github \
            client/tests/e2e/desktop/functional.spec.ts \
            client/tests/e2e/desktop/ui-structure.spec.ts
      - name: 打包（AppImage + deb + zip）
        run: pnpm exec electron-builder --linux --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release
          retention-days: 14

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/client-v')
    runs-on: ubuntu-latest
    steps:
      # gh release create 需在本地 git 仓库解析 tag → 必须 checkout（本 job 不构建代码）
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-all
      - name: 断言产物齐全（防空 release 静默成功）
        run: |
          ls -lh dist-all/release-windows/ dist-all/release-linux/
          test -n "$(ls -A dist-all/release-windows)" || { echo "::error title=release::windows 产物为空"; exit 1; }
          test -n "$(ls -A dist-all/release-linux)" || { echo "::error title=release::linux 产物为空"; exit 1; }
      - name: 建 GitHub Release（tag 同名；幂等，可单独重跑）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # POSIX 安全（bash/dash 均可）：不用 pipefail / ERR trap，显式 if ! 检查
          set -u
          echo "diag: shell=$0 bash=${BASH_VERSION:-N/A} gh=$(command -v gh || echo MISSING) tag=${GITHUB_REF#refs/tags/} cwd=$(pwd)"
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在 → 仅覆盖上传"
          else
            echo "创建 release $TAG"
            if ! gh release create "$TAG" --title "$TAG" --notes "JavScribe Client — 未签名构建（签名/公证为后续议题）"; then
              echo "::error title=release-create-failed::gh release create 失败（报错见上方日志）"
              exit 1
            fi
          fi
          # gh release upload 对目录参数会递归上传 → 只取顶层真实产物：
          # 排除子目录（win-unpacked/linux-unpacked）与 junk（*.blockmap / latest*.yml / builder-debug.yml）
          assets=()
          while IFS= read -r -d '' f; do assets+=("$f"); done < <(
            find dist-all/release-windows dist-all/release-linux -maxdepth 1 -type f \
                 ! -name '*.blockmap' ! -name 'latest*.yml' ! -name 'builder-debug.yml' -print0
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error title=release-upload-failed::未找到真实产物（检查产物结构）"
            exit 1
          fi
          echo "上传 ${#assets[@]} 个产物："
          printf '  %s\n' "${assets[@]}"
          if ! gh release upload "$TAG" "${assets[@]}" --clobber; then
            echo "::error title=release-upload-failed::gh release upload 失败（报错见上方日志）"
            exit 1
          fi
          echo "release 资产："
          gh release view "$TAG" --json assets --jq '.assets[].name' || true