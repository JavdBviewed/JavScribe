# JavScribe Serve — CI/CD release（headless 服务端 exe）
# 触发：
#   - tag `serve-v*`：完整 release（打包 + /health 冒烟 + 建 GitHub Release）
#   - 手动 dispatch：调试构建（产物留 Actions artifacts，不建 Release）
# 平台：windows-latest（JavScribeServe.exe，无控制台）/ ubuntu-latest（jav-scribe-serve）
# 约定：tag 版本号必须等于 pyproject.toml 的 version（构建前校验，防打错包）。
name: release-serve

on:
  push:
    tags: ["serve-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-serve-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 校验 tag 版本 = pyproject.toml 版本
        if: startsWith(github.ref, 'refs/tags/serve-v')
        shell: bash
        run: |
          want="${GITHUB_REF#refs/tags/serve-v}"
          have="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$want" != "$have" ]; then
            echo "::error::tag 版本 $want 与 pyproject.toml 版本 $have 不一致"
            exit 1
          fi
      - name: 安装 pyinstaller + pywinpty（spec 内 collect_all("winpty") 依赖构建环境有 winpty）
        run: python -m pip install --upgrade pip && python -m pip install pyinstaller pywinpty
      - run: python -m PyInstaller --noconfirm --clean jav-scribe-serve.spec
      - name: 冒烟：启动 exe，/health 探活（零配置首启必须能起）
        shell: bash
        run: |
          ./dist/JavScribeServe.exe &
          EXE_PID=$!
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8300/health > /tmp/health.json; then ok=1; break; fi
            sleep 1
          done
          [ -n "$ok" ] || { echo "::error::30s 内 /health 未就绪"; tail -50 "$USERPROFILE/.jav_scribe/serve.log" 2>/dev/null; exit 1; }
          cat /tmp/health.json; echo
          taskkill //F //T //PID $EXE_PID >/dev/null 2>&1 || true
      - name: 打包 zip（exe + 配置模板 + 说明）
        shell: bash
        run: |
          rm -rf dist-package && mkdir -p dist-package release
          # zip 名带版本（JavScribe-Serve-{ver}-win-x64.zip）；内层 JavScribeServe.exe 名不变
          # ——客户端「同目录自动拉起本地服务端」按内层名探测
          VER="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          cp dist/JavScribeServe.exe dist-package/
          cp config/jav_scribe.example.json dist-package/config.example.json
          cp docs/serve-local.md dist-package/README.txt
          powershell -NoProfile -Command "Compress-Archive -Path dist-package/* -DestinationPath release/JavScribe-Serve-$VER-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release
          retention-days: 14

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 校验 tag 版本 = pyproject.toml 版本
        if: startsWith(github.ref, 'refs/tags/serve-v')
        run: |
          want="${GITHUB_REF#refs/tags/serve-v}"
          have="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$want" != "$have" ]; then
            echo "::error::tag 版本 $want 与 pyproject.toml 版本 $have 不一致"
            exit 1
          fi
      - run: python3 -m pip install --upgrade pip && python3 -m pip install pyinstaller
      - run: python3 -m PyInstaller --noconfirm --clean jav-scribe-serve.spec
      - name: 冒烟：启动 exe，/health 探活（零配置首启必须能起）
        run: |
          ./dist/jav-scribe-serve &
          EXE_PID=$!
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8300/health > /tmp/health.json; then ok=1; break; fi
            sleep 1
          done
          [ -n "$ok" ] || { echo "::error::30s 内 /health 未就绪"; tail -50 "$HOME/.jav_scribe/serve.log" 2>/dev/null; exit 1; }
          cat /tmp/health.json; echo
          kill $EXE_PID 2>/dev/null || true
      - name: 打包 zip（exe + 配置模板 + 说明）
        run: |
          rm -rf dist-package && mkdir -p dist-package release
          # zip 名带版本（JavScribe-Serve-{ver}-linux-x64.zip）；内层 jav-scribe-serve 名不变
          VER="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          cp dist/jav-scribe-serve dist-package/
          cp config/jav_scribe.example.json dist-package/config.example.json
          cp docs/serve-local.md dist-package/README.txt
          cd dist-package && zip -q ../release/JavScribe-Serve-$VER-linux-x64.zip * && cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release
          retention-days: 14

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/serve-v')
    runs-on: ubuntu-latest
    steps:
      # checkout：版本断言读 pyproject.toml、README 钉 tag 与 git 提交都需要本地仓库
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-all
      - name: 断言产物齐全（防空 release 静默成功）
        run: |
          VER="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          ls -lh "dist-all/release-windows/JavScribe-Serve-$VER-win-x64.zip" \
                 "dist-all/release-linux/JavScribe-Serve-$VER-linux-x64.zip"
          echo "$VER" > /tmp/serve-ver.txt
      - name: 建 GitHub Release（tag 同名；幂等，可单独重跑）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # POSIX 安全（bash/dash 均可）：不用 pipefail / ERR trap，显式 if ! 检查
          set -u
          echo "diag: shell=$0 bash=${BASH_VERSION:-N/A} gh=$(command -v gh || echo MISSING) tag=${GITHUB_REF#refs/tags/} cwd=$(pwd)"
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在 → 仅覆盖上传"
          else
            echo "创建 release $TAG"
            if ! gh release create "$TAG" --title "$TAG" --notes "JavScribe Serve — headless 服务端（无 GUI）"; then
              echo "::error title=release-create-failed::gh release create 失败（报错见上方日志）"
              exit 1
            fi
          fi
          VER="$(cat /tmp/serve-ver.txt)"
          if ! gh release upload "$TAG" \
            "dist-all/release-windows/JavScribe-Serve-$VER-win-x64.zip" \
            "dist-all/release-linux/JavScribe-Serve-$VER-linux-x64.zip" --clobber; then
            echo "::error title=release-upload-failed::gh release upload 失败（报错见上方日志）"
            exit 1
          fi
          echo "release 资产："
          gh release view "$TAG" --json assets --jq '.assets[].name' || true
      - name: 钉 README 最新版 tag（服务端行）
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node scripts/pin-readme-release.mjs serve "${GITHUB_REF#refs/tags/}"