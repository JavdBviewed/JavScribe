# JavScribe — company GPU server deployment (one container = engine + service)
#
#   推荐（CI 预构建镜像，tag 触发发布到 ghcr.io）：
#   JAV_WATCH_DIR=/path/to/your/media \
#   docker compose -f docker/docker-compose.yml pull && \
#   docker compose -f docker/docker-compose.yml up -d
#
#   离线/改引擎版本时本地构建：加 --build（build 段仍保留）
#
# Env overrides:
#   JAV_PORT          host port for the progress/upload API (default 8300)
#   JAV_MODELS_DIR    host dir for model weights (default /opt/jav-scribe/models)
#   JAV_WATCH_DIR     host dir to watch for finished downloads (default /media/jav)
#   JAVSCRIBE_API_KEY  auth key for the /config settings API (optional)
#   JAVSCRIBE_HOST_ROOT container prefix of the read-only host mount (default
#                        off). Set to /hostfs to let /scan resolve host paths
#                        (e.g. /media/jav) that are not otherwise mounted in.
#   JAV_HOSTFS         host root to bind RO at /hostfs (default /)
name: jav-scribe

services:
  jav-scribe:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        CHICKENRICE_REF: v1.9
    # CI 预构建镜像（serve-v* tag → ghcr.io）；离线场景 up -d --build 回退本地构建
    image: ghcr.io/javdbviewed/jav-scribe-serve:latest
    container_name: jav-scribe
    restart: unless-stopped
    shm_size: "4g"
    environment:
      TZ: Asia/Shanghai
      # Optional: enables /config (settings) management with X-Api-Key auth.
      # The web workbench stores the same key per service when you add it.
      JAVSCRIBE_API_KEY: "${JAVSCRIBE_API_KEY:-}"
      # When set (e.g. /hostfs), /scan + /scan/submit fall back to
      # <prefix>/<host path> for paths that don't exist in the container.
      JAVSCRIBE_HOST_ROOT: "${JAVSCRIBE_HOST_ROOT:-}"
    ports:
      - "${JAV_PORT:-8300}:8300"
    volumes:
      # Model weights (first-boot download, persists across rebuilds)
      - ${JAV_MODELS_DIR:-/opt/jav-scribe/models}:/opt/chickenrice/models
      # Media directory to watch (BT/PT landing spot; .zh.srt lands next to source)
      - ${JAV_WATCH_DIR:-/media/jav}:/media/jav
      # Read-only view of the host filesystem, only reachable via /scan when
      # JAVSCRIBE_HOST_ROOT is set (see docs/docker.md security note).
      - ${JAV_HOSTFS:-/}:/hostfs:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
