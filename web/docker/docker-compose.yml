# JavScribe-Web subtitle workbench — a single service.
#
# Subtitle services (JavScribe `serve`) run separately on each GPU machine;
# this service only polls them and relays uploads.
#
#   JAV_ENGINES="服务A=http://<IP_A>:8300,服务B=http://<IP_B>:8300" \
#   docker compose -f docker/docker-compose.yml up -d --build
#
# Env overrides:
#   JAV_ENGINES      preset service table, comma-separated name=URL
#   JAV_WEB_PORT     host port (default 8400)
#   JAV_WEB_DATA_DIR host dir for the engine registry (default /opt/jav-scribe-web/data)
name: jav-scribe-web

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: javscribe-web:latest
    container_name: jav-scribe-web
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAV_ENGINES: "${JAV_ENGINES:-}"
      # HTTPS port (0 disables); cert SANs for the self-signed cert, e.g. IP:192.168.0.127
      JAV_WEB_TLS_PORT: "${JAV_WEB_TLS_PORT:-8443}"
      JAV_WEB_CERT_SANS: "${JAV_WEB_CERT_SANS:-IP:127.0.0.1}"
    ports:
      - "${JAV_WEB_PORT:-8400}:8400"
      # HTTPS (self-signed; required for "write back to source directory" / FS Access API)
      - "${JAV_WEB_TLS_PORT:-8443}:8443"
    volumes:
      - ${JAV_WEB_DATA_DIR:-/opt/jav-scribe-web/data}:/data
