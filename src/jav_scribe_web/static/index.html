<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JavScribe 中控室</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-dot" id="brand-dot"></span>
    <div class="brand-text">
      <h1>中控室</h1>
      <span class="brand-sub">JAVSCRIBE · CONTROL ROOM</span>
    </div>
  </div>
  <div class="hud">
    <span id="health" class="hud-item">连接中…</span>
    <span id="clock" class="hud-item mono">--:--:--</span>
  </div>
</header>

<main>
  <section id="sec-engines">
    <div class="sec-head">
      <div class="sec-title"><span class="kicker">Workshops</span><h2>车间</h2></div>
      <form id="engine-form" autocomplete="off">
        <input id="engine-name" placeholder="名称，如 公司3090" required maxlength="40">
        <input id="engine-url" type="url" placeholder="http://地址:8300" required>
        <button type="submit" class="btn">添加车间</button>
      </form>
    </div>
    <div id="engine-grid"></div>
    <div id="engines-empty" class="empty">
      <div class="empty-icon">&#9673;</div>
      <div>还没有车间</div>
      <div class="muted small">用上方表单添加，或用环境变量 <span class="mono">JAV_ENGINES="名称=URL"</span> 预置</div>
    </div>
  </section>

  <section id="sec-jobs">
    <div class="sec-head">
      <div class="sec-title"><span class="kicker">Tasks</span><h2>任务</h2></div>
      <div id="job-stats" class="stats"></div>
      <div id="job-filter" class="seg" role="group" aria-label="筛选任务">
        <button type="button" data-f="all" class="on">全部</button>
        <button type="button" data-f="running">进行中</button>
        <button type="button" data-f="finished">已完成</button>
      </div>
      <span id="last-updated" class="muted small mono"></span>
    </div>
    <div class="job-head mono">
      <span>车间</span><span>文件</span><span>状态</span><span>进度</span><span>位置</span><span>耗时</span><span></span>
    </div>
    <div id="job-list" class="table-wrap"></div>
    <div id="jobs-empty" class="empty">
      <div class="empty-icon">&#9636;</div>
      <div id="jobs-empty-text">暂无任务</div>
      <div class="muted small">把影片拖到下方派工单，或等车间监听目录自动入列</div>
    </div>
  </section>

  <section id="sec-dispatch">
    <div class="sec-head">
      <div class="sec-title"><span class="kicker">Dispatch</span><h2>派工单</h2></div>
    </div>

    <div id="drop" role="button" tabindex="0" aria-label="选择影片文件">
      <div class="drop-icon">&#9654;</div>
      <div class="drop-main">拖入影片，或点击选择文件</div>
      <div class="muted small">mp4 / mkv / ts / mov … 原片只到本服务（不出本机），抽音轨后只把 opus 派给车间</div>
      <input type="file" id="file" hidden accept=".mp4,.mkv,.ts,.m2ts,.avi,.mov,.mp3,.m4a,.flac,.wav,.ogg,.opus,.webm">
    </div>

    <div id="file-chip" hidden>
      <span class="chip-icon">&#9636;</span>
      <span id="chip-name"></span>
      <span id="chip-size" class="chip-size mono"></span>
      <button type="button" id="chip-x" class="icon-btn" title="移除文件">&#10005;</button>
    </div>

    <div id="dispatch-bar">
      <label class="field">
        <span class="field-label">派给车间</span>
        <select id="engine-select"></select>
      </label>
      <button id="dispatch-go" class="btn btn-primary" disabled>&#9654; 开始派工</button>
    </div>

    <div id="pipeline" hidden>
      <div class="step" id="step-upload">
        <div class="step-dot">1</div>
        <div class="step-body"><div class="step-name">上传</div><div class="step-meta" id="meta-upload"></div></div>
      </div>
      <div class="step-line" id="line-1"></div>
      <div class="step" id="step-extract">
        <div class="step-dot">2</div>
        <div class="step-body"><div class="step-name">抽音轨</div><div class="step-meta" id="meta-extract"></div></div>
      </div>
      <div class="step-line" id="line-2"></div>
      <div class="step" id="step-dispatch">
        <div class="step-dot">3</div>
        <div class="step-body"><div class="step-name">派工</div><div class="step-meta" id="meta-dispatch"></div></div>
      </div>
      <div id="dispatch-progress"><div id="dispatch-fill"></div></div>
    </div>
    <div id="dispatch-status" class="dispatch-status" hidden></div>
  </section>
</main>

<footer>
  <span class="mono">JAVSCRIBE-WEB</span>
  <span id="foot-ver" class="muted mono"></span>
  <span class="muted">大屏 5s · 流水线 1s</span>
</footer>
<div id="toasts" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
