[project]
name = "jav-scribe"
version = "0.1.4"
description = "JavScribe — JAV 字幕生成与媒体库联动：ja→zh ASR（模型自持）、.zh.srt 原位落位、下载目录监听、进度查询、远端处理"
readme = "README.md"
authors = [
    { name = "JavdBviewed" },
    { name = "maudslice (original JAVSubTool)", email = "maudslice@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    # Windows headless 链路需要 ConPTY 驱动 ChickenRice infer（tqdm 进度在
    # GBK 管道下会乱码）；Linux 纯 Popen 用不到，条件依赖避免多余安装。
    'pywinpty>=2.2.1; sys_platform == "win32"',
]

[dependency-groups]
build = ["pyinstaller>=6.10"]

[project.scripts]
jav-scribe = "jav_scribe:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
